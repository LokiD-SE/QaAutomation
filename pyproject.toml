[project]
name = "qa-automation"
version = "0.1.0"
description = "Bizom web + Android automation suite, grown ticket by ticket from Greybox runs"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.3",
    "pytest-playwright>=0.6",
    "playwright>=1.48",
    "pytest-html>=4.1",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "pytest-xdist>=3.6"]

[tool.setuptools]
packages = ["qa", "qa.web", "qa.app", "pages", "pages.web", "screens", "screens.app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-ra",
    "--import-mode=importlib",
    "--strict-markers",
    "--junitxml=reports/junit.xml",
    "--html=reports/report.html",
    "--self-contained-html",
    "--screenshot=only-on-failure",
    "--output=reports/artifacts",
]
markers = [
    "unit: tests of the framework itself - no portal, device or secrets",
    "web: drives the Bizom web portal in a browser",
    "app: drives the Bizom Android app on an adb device",
    "smoke: quick check that the build is usable",
    "regression: part of the release regression set",
    "destructive: changes shared company settings - run only on a QA company",
    "ticket(key): the Zoho / Bugzilla ticket the test came from, e.g. ticket('PR1-T13616')",
    "case(id): the test-case id in the ticket's sheet, e.g. case('TC_WEB_003')",
    "role(name): the login the test runs as, e.g. role('ADMIN')",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["tickets/*/reference", "explore/out"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
