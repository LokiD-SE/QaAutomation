[project]
name = "qa-automation"
version = "0.2.0"
description = "Bizom Android app automation (pytest + Appium); the web suite is Playwright Test in web/"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.3",
    "pytest-html>=4.1",
    "Appium-Python-Client>=5,<7",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "pytest-xdist>=3.6"]

[tool.setuptools]
packages = ["qa", "qa.app", "screens", "screens.app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-ra",
    "--import-mode=importlib",
    "--strict-markers",
    "--junitxml=reports/app-junit.xml",
    "--html=reports/app-report.html",
    "--self-contained-html",
]
markers = [
    "unit: tests of the framework itself - no portal, device or secrets",
    "app: drives the Bizom Android app on a device (Appium, or adb with QA_APP_DRIVER=adb)",
    "smoke: quick check that the build is usable",
    "regression: part of the release regression set",
    "destructive: changes shared company settings - run only on a QA company",
    "ticket(key): the Zoho / Bugzilla ticket the test came from, e.g. ticket('PR1-T13616')",
    "case(id): the test-case id in the ticket's sheet, e.g. case('TC_WEB_003')",
    "role(name): the login the test runs as, e.g. role('ADMIN')",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["tickets/*/reference", "explore/out", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
