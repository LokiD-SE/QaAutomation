name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      grep:
        description: "web tests to run against a company, as a Playwright --grep (e.g. @smoke, @PR1-T13616); needs repository secrets"
        required: false
        default: ""

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci --no-fund --no-audit
      - run: npx playwright install --with-deps chromium
      - name: web - types
        run: npx tsc --noEmit
      - name: web - framework tests
        run: npx playwright test --project=unit
      - name: web - every test collects
        run: npx playwright test --list --project=chromium
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - name: app - framework tests
        run: pytest -m unit
      - name: app - every test collects
        run: pytest --collect-only -q

  web:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.grep != ''
    needs: checks
    runs-on: ubuntu-latest
    env:
      QA_COMPANY: ${{ secrets.QA_COMPANY }}
      BIZOM_WEB_URL: ${{ secrets.BIZOM_WEB_URL }}
      BIZOM_WEB_USER: ${{ secrets.BIZOM_WEB_USER }}
      BIZOM_WEB_PASSWORD: ${{ secrets.BIZOM_WEB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium --grep "$GREP" --grep-invert @destructive
        env:
          GREP: ${{ github.event.inputs.grep }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-reports
          path: |
            reports/web-html/
            reports/web-junit.xml
            reports/web-artifacts/
